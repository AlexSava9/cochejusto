<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Contacto | CocheJusto</title>
  <meta name="description" content="Contacta con CocheJusto.es. Sugerencias, colaboraciones o consultas sobre precios de reparaciones de coches."/>
  <meta name="robots" content="noindex"/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1748903089672812" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--surface:#181c27;--border:#252a38;--text:#e8eaf0;--muted:#7a8099;--accent:#f5a623;--accent-dk:#c4831a;--green:#22c55e;--radius:12px}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid var(--border);background:rgba(15,17,23,.92)}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}
    nav a.back{font-size:.85rem;color:var(--muted);text-decoration:none}
    .content{max-width:600px;margin:4rem auto;padding:0 1.5rem}
    h1{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;margin-bottom:.75rem}
    .subtitle{color:var(--muted);font-size:.95rem;margin-bottom:2.5rem;line-height:1.7}
    .form-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2.5rem}
    label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:.4rem;margin-top:1.25rem}
    label:first-of-type{margin-top:0}
    input[type="text"],input[type="email"],textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:'Inter',sans-serif;padding:.75rem 1rem;outline:none;transition:border-color .15s;resize:vertical}
    input:focus,textarea:focus{border-color:var(--accent)}
    textarea{min-height:140px}
    .btn{width:100%;margin-top:1.75rem;background:var(--accent);color:#0f1117;border:none;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;padding:.9rem;border-radius:var(--radius);cursor:pointer;transition:background .15s}
    .btn:hover{background:var(--accent-dk)}
    .success{display:none;margin-top:1.5rem;background:rgba(34,197,94,.1);border:1px solid var(--green);border-radius:10px;padding:1.25rem;text-align:center;color:var(--green);font-weight:600}
    footer{border-top:1px solid var(--border);padding:2rem 1.5rem;text-align:center;font-size:.78rem;color:var(--muted);margin-top:4rem}
    footer a{color:var(--muted);text-decoration:underline}
  </style>
</head>
<body>
<nav><a href="/" class="logo">Coche<span>Justo</span></a><a href="/" class="back">← Volver al inicio</a></nav>
<div class="content">
  <h1>Contacto</h1>
  <p class="subtitle">¿Tienes una sugerencia, quieres proponer una reparación que no está en la lista o tienes cualquier otra consulta? Escríbenos y te respondemos.</p>
  <div class="form-card">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Tu nombre"/>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="tu@email.com"/>
    <label for="asunto">Asunto</label>
    <input type="text" id="asunto" placeholder="¿En qué podemos ayudarte?"/>
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" placeholder="Escribe tu mensaje aquí…"></textarea>
    <button class="btn" onclick="enviar()">Enviar mensaje →</button>
    <div class="success" id="success">✅ Mensaje recibido. Te responderemos pronto.</div>
  </div>
</div>
<footer>
  <p>CocheJusto.es · <a href="/">Inicio</a> · <a href="/aviso-legal/">Aviso legal</a> · <a href="/privacidad/">Privacidad</a></p>
</footer>
<script>
function enviar(){
  const n=document.getElementById('nombre').value;
  const e=document.getElementById('email').value;
  const m=document.getElementById('mensaje').value;
  if(!n||!e||!m)return alert('Por favor rellena todos los campos obligatorios.');
  document.getElementById('success').style.display='block';
  document.querySelector('.btn').disabled=true;
  document.querySelector('.btn').textContent='Enviado ✓';
}
</script>
</body></html>
